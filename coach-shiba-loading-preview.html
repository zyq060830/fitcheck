<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>柴教练加载动画预览</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(240, 159, 18, 0.16), transparent 32%),
          linear-gradient(180deg, #f7edd5 0%, #f3e6c6 100%);
        color: #2f2a25;
        font-family:
          "Noto Sans SC",
          "PingFang SC",
          "Microsoft YaHei",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .preview-card {
        width: min(92vw, 430px);
        padding: 24px;
        border: 1px solid rgba(212, 192, 144, 0.95);
        border-radius: 34px;
        background: rgba(255, 250, 240, 0.78);
        box-shadow: 0 20px 60px rgba(115, 88, 32, 0.16);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .preview-kicker {
        margin: 0 0 8px;
        color: #4ead9d;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 26px;
        line-height: 1.2;
      }

      .coach-shiba-loading {
        display: inline-flex;
        width: min(100%, 360px);
      }

      .coach-shiba-loading svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      .csl-shadow {
        animation: csl-shadow 3s ease-in-out infinite;
        transform-origin: 180px 270px;
      }

      .csl-shiba {
        animation: csl-body-bob 3s ease-in-out infinite;
        transform-origin: 180px 188px;
      }

      .csl-head {
        animation: csl-look-around 3s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }

      .csl-brow {
        animation: csl-brow-check 3s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .csl-magnifier-arm {
        animation: csl-lift-magnifier 3s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
        transform-box: fill-box;
        transform-origin: 126px 212px;
      }

      .csl-magnifier {
        animation: csl-scan-wiggle 3s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 80px 132px;
      }

      .csl-scan-ring,
      .csl-scan-line {
        animation: csl-scan-visible 3s ease-in-out infinite;
      }

      .csl-scan-ring {
        stroke-dasharray: 18 10;
        animation-name: csl-scan-visible, csl-scan-dash;
        animation-duration: 3s, 0.9s;
        animation-timing-function: ease-in-out, linear;
        animation-iteration-count: infinite, infinite;
      }

      .csl-sparkle {
        animation: csl-sparkle 3s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .csl-message,
      .csl-message-pill {
        animation: csl-message-in 3s ease-in-out infinite;
      }

      .csl-dot {
        animation: csl-dot-pulse 3s ease-in-out infinite;
      }

      .csl-dot:nth-of-type(2) {
        animation-delay: 0.12s;
      }

      .csl-dot:nth-of-type(3) {
        animation-delay: 0.24s;
      }

      @keyframes csl-body-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        18% {
          transform: translateY(-5px);
        }
        34%,
        66% {
          transform: translateY(-2px);
        }
        82% {
          transform: translateY(-3px);
        }
      }

      @keyframes csl-shadow {
        0%,
        100% {
          transform: scaleX(1);
          opacity: 0.48;
        }
        18% {
          transform: scaleX(0.88);
          opacity: 0.34;
        }
        34%,
        66% {
          transform: scaleX(0.95);
          opacity: 0.4;
        }
      }

      @keyframes csl-lift-magnifier {
        0%,
        7% {
          transform: translate(28px, 46px) rotate(-34deg) scale(0.94);
          opacity: 0.9;
        }
        27%,
        72% {
          transform: translate(0, 0) rotate(0deg) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(28px, 46px) rotate(-34deg) scale(0.94);
          opacity: 0.9;
        }
      }

      @keyframes csl-scan-wiggle {
        0%,
        33%,
        66%,
        100% {
          transform: translateX(0) rotate(0deg);
        }
        42% {
          transform: translateX(-9px) rotate(-5deg);
        }
        54% {
          transform: translateX(10px) rotate(5deg);
        }
        62% {
          transform: translateX(-3px) rotate(-2deg);
        }
      }

      @keyframes csl-look-around {
        0%,
        33%,
        66%,
        100% {
          transform: translateX(0) rotate(0deg);
        }
        42% {
          transform: translateX(-5px) rotate(-2.5deg);
        }
        54% {
          transform: translateX(6px) rotate(2.5deg);
        }
        62% {
          transform: translateX(-2px) rotate(-1deg);
        }
      }

      @keyframes csl-brow-check {
        0%,
        34%,
        66%,
        100% {
          transform: translateY(0);
        }
        42%,
        54% {
          transform: translateY(-2px);
        }
      }

      @keyframes csl-scan-visible {
        0%,
        30%,
        68%,
        100% {
          opacity: 0;
        }
        36%,
        63% {
          opacity: 1;
        }
      }

      @keyframes csl-scan-dash {
        to {
          stroke-dashoffset: -56;
        }
      }

      @keyframes csl-message-in {
        0%,
        64%,
        100% {
          opacity: 0;
          transform: translateY(10px);
        }
        72%,
        94% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes csl-dot-pulse {
        0%,
        64%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        74%,
        92% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @keyframes csl-sparkle {
        0%,
        18%,
        36%,
        64%,
        100% {
          opacity: 0;
          transform: scale(0.6) rotate(0deg);
        }
        24%,
        48%,
        76% {
          opacity: 1;
          transform: scale(1) rotate(12deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .coach-shiba-loading * {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
        }

        .csl-message,
        .csl-message-pill {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
